# ข้อมูลโปรเจกต์
sonar.projectKey=hotel-carbon-api
sonar.projectName=Hotel Carbon Footprint System
sonar.projectVersion=1.0

# กำหนดโฟลเดอร์ที่ต้องการสแกน (สแกนทั้ง backend และ frontend)
sonar.sources=backend,frontend

# ยกเว้นโฟลเดอร์ที่ไม่ต้องสแกน
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/*.spec.js, **/*.test.js, **/coverage/**

# ที่อยู่ Server และ Encoding
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8